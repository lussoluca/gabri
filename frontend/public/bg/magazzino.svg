<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1626"/>
      <stop offset="1" stop-color="#2e2640"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3050"/>
      <stop offset="1" stop-color="#241e33"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#d5c9a0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d5c9a0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="goldglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#ffd700" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- parete di fondo -->
  <rect width="960" height="390" fill="url(#wall)"/>

  <!-- travi in legno -->
  <g fill="#141020">
    <rect x="0" y="0" width="960" height="26"/>
    <rect x="120" y="0" width="22" height="390"/>
    <rect x="460" y="0" width="22" height="390"/>
    <rect x="820" y="0" width="22" height="390"/>
    <path d="M 0 26 L 960 26 L 960 40 L 0 40 Z" opacity="0.6"/>
  </g>
  <g stroke="#0d0a18" stroke-width="2" opacity="0.7">
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="220" x2="960" y2="220"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
  </g>

  <!-- finestrella con luce -->
  <rect x="640" y="60" width="70" height="54" fill="#8a94b0"/>
  <g stroke="#141020" stroke-width="5">
    <line x1="675" y1="60" x2="675" y2="114"/>
    <line x1="640" y1="87" x2="710" y2="87"/>
  </g>
  <path d="M 640 60 L 710 114 L 560 390 L 380 390 Z" fill="url(#shaft)"/>

  <!-- pavimento in assi (walkbox 30,380 900x60) -->
  <rect y="372" width="960" height="68" fill="url(#floor)"/>
  <g stroke="#181328" stroke-width="2">
    <line x1="0" y1="372" x2="960" y2="372"/>
    <line x1="0" y1="394" x2="960" y2="394"/>
    <line x1="0" y1="416" x2="960" y2="416"/>
    <line x1="110" y1="372" x2="100" y2="440"/>
    <line x1="310" y1="372" x2="300" y2="440"/>
    <line x1="510" y1="372" x2="520" y2="440"/>
    <line x1="710" y1="372" x2="720" y2="440"/>
    <line x1="880" y1="372" x2="890" y2="440"/>
  </g>

  <!-- pile di casse -->
  <g fill="#4a3a58" stroke="#241e33" stroke-width="2">
    <rect x="680" y="290" width="80" height="86"/>
    <rect x="770" y="316" width="66" height="60"/>
    <rect x="700" y="228" width="66" height="62"/>
    <rect x="150" y="300" width="72" height="76"/>
    <rect x="230" y="330" width="56" height="46"/>
  </g>
  <g stroke="#241e33" stroke-width="1.5" opacity="0.9">
    <line x1="680" y1="333" x2="760" y2="333"/>
    <line x1="700" y1="259" x2="766" y2="259"/>
    <line x1="150" y1="338" x2="222" y2="338"/>
  </g>
  <g fill="#8a94b0" opacity="0.25">
    <path d="M 700 228 L 766 228 L 760 236 L 706 236 Z"/>
  </g>

  <!-- botti in fondo -->
  <g>
    <path d="M 44 300 Q 40 340 44 376 L 108 376 Q 112 340 108 300 Z" fill="#4a3550"/>
    <ellipse cx="76" cy="299" rx="32" ry="8" fill="#5a4260"/>
    <g stroke="#2a2035" stroke-width="3" fill="none">
      <path d="M 42 315 Q 76 322 110 315"/>
      <path d="M 42 358 Q 76 365 110 358"/>
    </g>
  </g>

  <!-- ragnatela -->
  <g stroke="#8a94b0" stroke-width="1" opacity="0.35" fill="none">
    <path d="M 960 26 L 900 80 M 960 26 L 926 96 M 960 26 L 872 60"/>
    <path d="M 916 62 Q 930 70 942 60 M 894 50 Q 916 62 936 44"/>
  </g>

  <!-- baule del tesoro (hotspot 430,300 110x90) -->
  <g>
    <circle cx="485" cy="330" r="90" fill="url(#goldglow)"/>
    <ellipse cx="485" cy="384" rx="62" ry="10" fill="#000" opacity="0.4"/>
    <rect x="432" y="322" width="106" height="60" rx="6" fill="#6a4520"/>
    <path d="M 432 326 Q 485 288 538 326 L 538 340 L 432 340 Z" fill="#7a5228"/>
    <ellipse cx="485" cy="322" rx="53" ry="12" fill="#ffd700"/>
    <g fill="#ffe066">
      <circle cx="460" cy="318" r="6"/><circle cx="478" cy="314" r="6"/>
      <circle cx="496" cy="316" r="6"/><circle cx="512" cy="320" r="6"/>
      <circle cx="470" cy="322" r="6"/><circle cx="504" cy="323" r="6"/>
      <circle cx="487" cy="320" r="7"/>
    </g>
    <g stroke="#3a2815" stroke-width="3">
      <line x1="452" y1="330" x2="452" y2="382"/>
      <line x1="518" y1="330" x2="518" y2="382"/>
    </g>
    <rect x="475" y="330" width="20" height="24" rx="3" fill="#c9b370"/>
    <rect x="481" y="338" width="8" height="10" fill="#6a4520"/>
    <!-- monete cadute -->
    <g fill="#ffd700">
      <ellipse cx="416" cy="382" rx="8" ry="3"/>
      <ellipse cx="556" cy="378" rx="8" ry="3"/>
      <ellipse cx="540" cy="388" rx="7" ry="3"/>
    </g>
  </g>

  <!-- uscita verso la città (hotspot 0,220 50x260) -->
  <g>
    <rect x="0" y="220" width="48" height="170" fill="#0d0a18"/>
    <rect x="44" y="220" width="10" height="170" fill="#4a3218"/>
    <text x="24" y="250" font-family="serif" font-size="13" fill="#c9b370" text-anchor="middle">CITTÀ</text>
    <path d="M 34 262 L 14 262 L 14 256 L 4 266 L 14 276 L 14 270 L 34 270 Z" fill="#c9b370"/>
  </g>
</svg>
